<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cybersecurity Training Survey</title>
</head>
<body>

  <h1 id="title">Cybersecurity Training Survey</h1>

  <p id="description">
    Help us improve our cybersecurity courses by answering a few quick questions.
  </p>

  <form id="survey-form">

    <label id="name-label" for="name">Name</label>
    <input
      id="name"
      type="text"
      placeholder="Enter your full name"
      required
    >

    <label id="email-label" for="email">Email</label>
    <input
      id="email"
      type="email"
      placeholder="Enter your email address"
      required
    >

    <label id="number-label" for="number">Age</label>
    <input
      id="number"
      type="number"
      min="13"
      max="100"
      placeholder="Enter your age"
    >

    <label for="dropdown">Which course are you most interested in?</label>
    <select id="dropdown">
      <option value="security-plus">Security+</option>
      <option value="ethical-hacking">Ethical Hacking</option>
      <option value="malware-analysis">Malware Analysis</option>
      <option value="devsecops">DevSecOps</option>
    </select>

    <p>Would you recommend this training platform?</p>

    <label>
      <input type="radio" name="recommend" value="yes">
      Yes
    </label>

    <label>
      <input type="radio" name="recommend" value="no">
      No
    </label>

    <p>Which topics are you interested in?</p>

    <label>
      <input type="checkbox" value="network-security">
      Network Security
    </label>

    <label>
      <input type="checkbox" value="penetration-testing">
      Penetration Testing
    </label>

    <label>
      <input type="checkbox" value="malware-analysis">
      Malware Analysis
    </label>

    <label>
      <input type="checkbox" value="cloud-security">
      Cloud Security
    </label>

    <label for="comments">Additional Comments</label>
    <textarea
      id="comments"
      placeholder="Tell us what you would like to see improved..."
    ></textarea>

    <button id="submit" type="submit">Submit</button>

  </form>

</body>
</html>
